# Render Blueprint: New > Blueprint, pick this repository, then fill in the values marked
# sync: false. The database is Neon, not Render (deployment.md).
services:
  - type: web
    name: settle
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Neon connection string, with ?sslmode=require
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY # optional: AI mapping suggestions
        sync: false
